# --- Cohort flow diagram (esbl_rf.cohort_derivation.build_flowchart) ----
flowchart:
  sql_link_step: 3               # SQL step whose cohort is spell_microbiology.csv (Python's first step)
  sql_informational_steps: [31]  # "of which" rows: shown, but not part of the exclusion chain

# --- Charlson Comorbidity Index (comorbidicare) -------------------------
cci:
  cutoff: admission              # evidence strictly before admission
  date_columns:                  # parsed as dates when the CSVs are read (esbl_rf.steps.run_comorbidity)
    diagnoses: [diagnosis_date]
    problems: [problem_dt_tm]
    prescriptions: [order_dt_tm]
  text_columns:                  # read as strings: comorbidicare matches codes as text (SNOMED exact, ICD-10 prefix)
    diagnoses: [diagnosis_code_icd, diagnosis_code_snomed]
    problems: [problem_code]
  group_edges: [0, 1, 3]         # cci_group: 0 | 1-2 | >=3 (left-closed bins)
  group_labels: ["0", "1-2", ">=3"]

# --- Logistic regression (esbl_rf.models) ---------------------------------
# Analysis plan section 8. Odds ratios only (no prediction metrics, decided 2026-11-23).
logistic_regression:
  cluster_col: subject           # patient-clustered standard errors
  order_col: first_culture_dt    # "first episode per patient" = earliest first culture

  # Candidate predictors (analysis plan section 7). Temperature and CRP (decided
  # 2026-11-23) and the timing variables days_from_admission_to_first_culture and
  # min_days_from_surgery_to_infection (decided 2026-11-24) are descriptive only.
  predictors:
    continuous:
      - age_at_admission         # per year
      - imd_decile               # per decile
      - surgery_length           # per hour
      - cci_score                # CHANGE vs manuscript: replaces the individual comorbidities
    binary:
      - past_abx
      - inpatient_exposure_90d
      - prior_positive_esbl
    categorical:
      - gender
      - ethnicity_desc
      - organism_bug
      - site
      - tfc
      - prophylaxis_group

  reference_levels:
    gender: female
    site: blood
    organism_bug: escherichia coli
    ethnicity_desc: white
    tfc: general_surgery
    prophylaxis_group: "cefuroxime +/- metronidazole"

  # Variable selection: univariable p < screen_p (joint Wald test over all levels
  # of a variable) or clinically important (prespecified, analysis plan 8.3).
  screen_p: 0.20
  clinically_important:
    - age_at_admission
    - gender
    - prior_positive_esbl
    - tfc
    - prophylaxis_group
    - organism_bug
    - site
    - cci_score
    - past_abx                   # added 2026-11-25: established ESBL risk factor
    - inpatient_exposure_90d     # added 2026-11-25: established ESBL risk factor

  # Sparse levels (decided 2026-11-24): a non-reference level with fewer than
  # min_events ESBL-positive or fewer than min_events non-ESBL episodes is merged
  # into merge_into[variable] before any model. Logged and listed in the diagnostics.
  sparse:
    min_events: 10
    merge_into:
      ethnicity_desc: other
      organism_bug: other
      site: other
      tfc: other
      prophylaxis_group: other

  vif_flag: 5                    # VIFs above this are flagged

  # Exploratory subgroups (analysis plan 8.6): the primary model within each level.
  subgroups: [tfc, site]
  min_subgroup_epv: 5            # below: not estimated (decided 2026-11-23)
  stable_subgroup_epv: 10        # 5 to <10: estimated, flagged as unstable
