# esbl_rf pipeline configuration (the "control panel"). Read once by
# esbl_rf.config.load_config; relative paths are resolved against the
# directory containing this file, so the working directory does not matter.

# --- Study definition ---------------------------------------------------
study:
  study_start: "2015-01-01"
  study_end: "2025-09-30"        # inclusive; decided 2026-11-12
  min_age: 18
  elective_admission_methods: [11, 12, 13]
  organisms:
    - escherichia coli
    - klebsiella pneumoniae
    - klebsiella oxytoca
    - proteus mirabilis

sample_eligibility:
  min_hours_after_admission: 48
  max_days_after_surgery: 30     # CHANGE vs manuscript (was: up to 30 days after discharge)
  # Screening (non-diagnostic) samples, as in the manuscript's split_microbiology_screens:
  # a lab culture code in culture_codes, or a rectal site. Compared lower-cased.
  screening:
    culture_codes: [crocul, itucul, rgns, xincul]
    rectal_sites: [rectal swab, rectum, rectal]

# Specimen site grouping (ported from the manuscript's group_specimen_site). Site and culture
# type are lower-cased, '-' and '/' become spaces, then the first group whose pattern matches
# wins; anything unmatched is other_label. Drop pattern: the manuscript's extra
# (?=.*pleural)(?=.*fluid) alternative was redundant with 'fluid' and is not kept.
sites:
  other_label: other
  groups:
    - {label: blood, pattern: '\bblood\b'}
    - {label: urine, pattern: '\burine\b|\burin\b'}
    - {label: sputum, pattern: '\bsputum\b|\bbronchoalveolar\b|\bbronchial\b|\bbal\b'}
    - {label: wound, pattern: '\bwound\b|\bpus\b'}
    - {label: drain, pattern: '\bdrain\b|\bfluid\b|\bbile\b'}
    - {label: tissue/biopsy, pattern: '\btissue\b|\bbiopsy\b'}
    - {label: tips_devices, pattern: '\btips\b|\btip\b|\bdevices\b|\bcatheter\b'}
  # Episode site = the first of these present among the episode's samples.
  hierarchy: [blood, urine, tips_devices, drain, wound, sputum, tissue/biopsy, other]

# Episode table (esbl_rf.episodes.aggregate_episodes): output column -> sample-table column.
episode_table:
  spell_columns:                 # taken once per episode; must not differ within an episode
    subject: subject
    spell_identifier: spell_identifier
    admission_date: admission_ts
    discharge_date: discharge_ts
    age_at_admission: age_at_admission_n
    imd_decile: index_of_multiple_deprivation_decile
    discharge_method: discharge_method   # NHS Data Dictionary code; in-hospital mortality
  index_sample_columns:          # taken from the episode's first sample (its attributed surgery)
    surgery_start_dt: surgery_start_ts
    surgery_stop_dt: surgery_stop_ts
    procedure_desc: procedure_desc
    surgical_area: surgical_area
    tfc: tfc_group
    n_surgeries: n_surgeries_before
    surgery_length: surgery_length_hours   # hours, from esbl_rf.surgery.add_surgery_length
    min_days_from_surgery_to_infection: days_from_surgery_to_sample
    surgery_event_id: surgery_event_id     # links the episode to its prophylaxis (surgery_abx.csv)

# Generic procedure labels (lower-case). Dropped from a spell only if the spell also has a
# real procedure (as in the manuscript's get_surgery_features). Emergency labels such as
# 'emergency ncepod (surg)' are removed in sql/pipeline/02_cohort.sql, so they must not appear.
surgery:
  meta_procedure_labels: [other operative procedure (surg), not in enumerations list]

episodes:
  gap_days: 14                   # new episode if gap since previous positive culture > gap_days

# ESBL labelling (analysis_plan section 6). Drugs and marker strings that the rules
# look for in the result strings of microbiology_results.csv (the strings themselves
# are classed resistant/susceptible by lookups/3GCR.csv and lookups/3GCS.csv).
outcome:
  resistant_drugs: [cefotaxime, ceftazidime, ceftriaxone, cefpodoxime, cefixime]   # any resistant result = ESBL
  # Surveillance rule (decided 2026-11-26): any one 3GC susceptible = non-ESBL. The 2026-11-17 rule
  # was [cefpodoxime] alone plus pairs [[cefotaxime, ceftazidime], [ceftriaxone, ceftazidime]].
  # cefalexin (1st generation) added 2026-11-26 as negative evidence only: ESBLs hydrolyse it, so S argues
  # against ESBL; it is NOT in resistant_drugs because cefalexin R has other causes (e.g. AmpC).
  susceptible_alone_drugs: [cefotaxime, ceftazidime, ceftriaxone, cefpodoxime, cefixime, cefalexin]
  susceptible_pairs: []                        # both susceptible = non-ESBL
  marker_prefix: "esbl markers (ss = present)"
  marker_positive: [sensitive, susceptible, "susceptible with optimised dosing, refer to antimicrobial policy"]
  marker_negative: [resistant]
  esbl_statement_column: esbl_statement        # sample flag in microbiology_ekp.csv: lab reports the ESBL-producer statement

# Demographics (esbl_rf.demographics). Keys are lower-cased ethnicity_desc values from
# demographics.csv (values listed in docs/data_dictionary.xlsx). Values not listed become
# missing and are logged with counts. Groups with fewer than ethnicity_min_count analysed
# episodes are then merged into ethnicity_sparse_into (decided 2026-11-23: Mixed stays its own
# group unless very few; previously sparse groups were set to missing).
demographics:
  ethnicity_groups:
    "white - british": white
    "white - irish": white
    "white - any other white background": white
    "british": white
    "other white": white
    "asian or asian british - indian": asian
    "asian or asian british - pakistani": asian
    "asian or asian british - bangladeshi": asian
    "asian - any other asian background": asian
    "other - chinese": asian
    "indian": asian
    "chinese": asian
    "other asian": asian
    "black or black british - african": black
    "black or black british - caribbean": black
    "black - any other black background": black
    "african (except somali)": black
    "other black": black
    "mixed - white and black caribbean": mixed
    "mixed - white and black african": mixed
    "mixed - white and asian": mixed
    "mixed - any other mixed background": mixed
    "white and asian": mixed
    "other mixed": mixed
    "other - any other ethnic group": other
    "any other ethnic group": other
    # Not stated / not known = missing, as in the manuscript (its Table 1 and model code
    # turned other_unknown into missing).
    "other - not stated": null
    "other - not known": null
    "not stated": null
    "not known": null
  ethnicity_min_count: 30
  ethnicity_sparse_into: other
  gender_groups:                 # lower-cased gender_desc -> level; null = deliberately missing
    female: female
    male: male
    unspecified: null
    not known: null

# Exposures before admission (esbl_rf.exposures).
exposures:
  lookback_days: 90              # must equal AT_PARAMS.lookback_days in sql/pipeline/00_params.sql
  prior_esbl_lookback_days: null # null = any time before admission (decided 2026-11-13)
  inpatient_columns:             # prior_inpatient_exposure.csv
    index_admission: index_admission_d
    prior_admission: prior_admission_d
    prior_discharge: prior_discharge_d

suppression_threshold: 5        # counts below this are shown as <5
rounding_base: 5                # flowchart and complete-case counts rounded to this (decided 2026-11-24)

# Antibiotic administrations (esbl_rf.antibiotics). Lists ported from the manuscript's
# configs/antibiotics.yaml; names are lower-cased before matching.
antibiotics:
  medication_col: medication_name_short
  route_col: route
  time_col: administration_ts
  # administration_status is not filtered (as in the manuscript); its values are logged
  # in the run log. TODO: check them in the first SDE run (e.g. doses not given).
  non_antibiotic_suffixes: [vir, zole, ine, nan, infusion, fungin, liposomal]
  exclude: [nystatin, foscarnet, enfuvirtide, glucose, efavirenz, tenofovir disoproxil, isoniazid,
            fluconazole, posaconazole, voriconazole, dapsone]
  keep: [doxycycline, lymecycline, minocycline, oxytetracycline, tigecycline, sulfadiazine, metronidazole]
  # Treatment agents: a prophylaxis course prefers other agents given at the same time.
  therapeutic_agents: [piperacillin-tazobactam, ciprofloxacin, meropenem, amikacin, ceftriaxone, colistin,
                       linezolid, avibactam-ceftazidime, ceftazidime, fosfomycin, cefiderocol,
                       "amoxicillin (contains penicillin)"]

# Perioperative prophylaxis (esbl_rf.antibiotics.choose_prophylaxis). The window itself is
# set in sql/pipeline/00_params.sql: 2 h before surgery start to 1 h after surgery stop
# (decided 2026-11-23).
prophylaxis:
  # The window is applied in SQL; these copies (must equal 00_params.sql, checked by
  # tests/test_config.py) are used only to describe it in the definitions table.
  hours_before_start: 2
  hours_after_stop: 1
  iv_routes: [iv]                # lower-cased route values counted as IV (manuscript: 'iv')
  combine_minutes: 10            # agents within this of the anchor dose form one course
  # Agent class by keyword in the agent name (an agent may match one class only).
  # Rules in esbl_rf.antibiotics.group_prophylaxis follow the manuscript's group_prophylaxis.
  agent_classes:
    co_amoxiclav: [co-amoxiclav]
    cefuroxime: [cefuroxime]
    aminoglycoside: [gentamicin, amikacin, tobramycin, streptomycin]
    limited_enterobacterales: [vancomycin, teicoplanin, daptomycin, linezolid, clindamycin, metronidazole,
                               flucloxacillin, "amoxicillin (contains penicillin)"]
    broad_gram_negative: [ceftriaxone, ciprofloxacin, levofloxacin, aztreonam, colistin, tigecycline,
                          piperacillin, tazobactam, tazocin, ertapenem, meropenem, imipenem, doripenem]
  group_labels:                  # manuscript labels (Table S1); the reference level is in logistic_regression
    co_amoxiclav: co-amoxiclav-based
    cefuroxime_aminoglycoside: cefuroxime +/- metronidazole + aminoglycoside
    cefuroxime: cefuroxime +/- metronidazole
    aminoglycoside: aminoglycoside-based
    limited_enterobacterales: limited_enterobact_activity
    broad_gram_negative: other_broad_spectrum_gram_negative_active
    none: no_prophylaxis
    other: other

# Temperature and CRP (esbl_rf.clinical): value closest to the episode's first culture,
# within window_hours either side, in the spell and after surgery start (decided 2026-11-23).
# Descriptive only. Values outside `plausible` are dropped as data errors.
clinical:
  window_hours: 48
  temperature:                   # temperature.csv (05_aux_tables.sql: AT_TEMPERATURE)
    value_col: temperature
    time_col: temp_performed_ts
    plausible: [30, 45]          # degrees C
  crp:                           # crp.csv (AT_CRP)
    value_col: crp
    time_col: sample_collected_ts
    plausible: [0, 1000]         # mg/L

# In-hospital mortality (esbl_rf.clinical.flag_in_hospital_death), from the spell's discharge
# method (NHS Data Dictionary). death_date is anonymised to month/year, so it is not used.
mortality:
  discharge_method_col: discharge_method
  died_codes: [4]                # 4 = patient died
  unknown_codes: [8, 9]          # 8 = not applicable, 9 = not known: set to missing

# --- Folders and files --------------------------------------------------
# Each folder is defined once; files below are names inside that folder.
paths:
  raw_dir: data/raw              # CSVs exported from the SDE Snowflake worksheets
  lookup_dir: lookups            # tracked: outcome definitions, no patient data
  interim_dir: data/interim      # checkpoints written by each step
  export_dir: outputs/export     # aggregate, suppressed outputs only

# One entry per CSV exported by sql/pipeline/10_exports.sql (grain in docs/sql_tables.md).
raw_csv:
  qa_flowchart_sql: qa_flowchart_sql.csv
  qa_build_log: qa_build_log.csv
  surgery_cohort: surgery_cohort.csv
  spells: spells.csv
  spell_microbiology: spell_microbiology.csv
  microbiology_ekp: microbiology_ekp.csv
  microbiology_results: microbiology_results.csv
  demographics: demographics.csv
  problems: problems.csv
  diagnoses: diagnoses.csv
  prescriptions: prescriptions.csv
  abx_administrations: abx_administrations.csv
  surgery_abx: surgery_abx.csv
  temperature: temperature.csv
  crp: crp.csv
  inpatient_exposure: prior_inpatient_exposure.csv

# Hand-maintained tables that already exist in the SDE (not exported from SQL).
lookup_csv:
  third_gen_ceph_resistant: 3GCR.csv
  third_gen_ceph_susceptible: 3GCS.csv

# treatment_function_code_des (stripped, lower-cased) -> specialty group, as in the
# manuscript's configs/tfc.yaml. Values not listed here are left missing and the
# step logs them with counts, so a spelling difference shows up on the first run.
tfc_groups:
  "hepatobiliary & pancreatic surgery": abdominal_gi
  "colorectal surgery": abdominal_gi
  "upper gastrointestinal surgery": abdominal_gi
  "general surgery": general_surgery
  "urology": uro_nephro
  "nephrology": uro_nephro
  "gynaecology": obs_gynae
  "gynaecological oncology": gynaecological_oncology
  "obstetrics": obs_gynae
  "cardiac surgery": cardiothoracic
  "thoracic surgery": cardiothoracic
  "cardiothoracic surgery": cardiothoracic
  "cardiology": cardiothoracic
  "trauma & orthopaedics": ortho_plastics
  "plastic surgery": ortho_plastics
  "neurosurgery": neuro_ent
  "ent": neuro_ent
  "vascular surgery": vascular

# --- Column names -------------------------------------------------------
# Column names as they appear after esbl_rf.io lower-cases the Snowflake headers.
# Typed timestamp columns (*_ts) come from sql/pipeline/01-04; raw names from
# docs/data_dictionary.xlsx.
columns:
  subject: subject
  spell: spell_identifier
  admission: admission_ts
  discharge: discharge_ts
  collect: collect_ts            # sample collection time (spell_microbiology.csv)
  surgery_start: surgery_start_ts
  surgery_stop: surgery_stop_ts
  surgery_anchor: surgery_anchor_ts   # surgery start (00_params.sql: surgery_anchor)
  organism: organism_bug
  culture_code: culture_code     # lab order code (spell_microbiology.csv)
  site: site
  procedure: procedure_desc      # surgery_cohort.csv
  culture_type: culture_type     # spell_microbiology.csv; used with site to group specimen sites
  site_group: site_grouped       # created by esbl_rf.sites
  tfc_desc: treatment_function_code_des   # truncated in the source (_des, not _desc)
  tfc_group: tfc_group           # created by esbl_rf.surgery.map_specialty
  # Surgery columns copied onto each sample from its most recent preceding surgery
  # (surgery_cohort.csv; names from sql/pipeline/02_cohort.sql).
  surgery_columns: [surgery_event_id, surgery_anchor_ts, surgery_start_ts, surgery_stop_ts,
                  procedure_desc, surgical_area, treatment_function_code_des]
  sample_key: [subject, lab_test_id, organism_bug]
  outcome: esbl_status           # grouping column for Table 1 and outcome of all models
  demographics: [subject, death_date, ethnicity_desc, gender_desc]          # kept on load
  problems: [subject, problem_code, problem_desc, problem_dt_tm]            # kept on load

# --- Table 1 ------------------------------------------------------------
table1:
  # Row blocks in the order of analysis_plan section 9. Episode level, by ESBL status
  # (columns.outcome). Descriptive only: no p-values. Every variable not listed
  # under categorical or binary is continuous and shown as median [IQR]
  # (CHANGE vs manuscript for some, decided 2026-11-13: skewed counts/durations).
  blocks:
    Patient characteristics:
      - age_at_admission
      - gender
      - ethnicity_desc               # check the size of Mixed here (decided 2026-11-23)
      - imd_decile
    Surgical characteristics:
      - tfc
      - n_surgeries
      - surgery_length
      - min_days_from_surgery_to_infection
      - prophylaxis_group
      - delta_hours_prophylaxis
    Clinical history and comorbidities:
      - cci_score
      - cci_group
      # Subset of the 17 Charlson flags (decided 2026-11-13); all 17 are in
      # supplementary_conditions below.
      - malignancy
      - metastatic_solid_tumor
      - diabetes_without_complication
      - diabetes_with_complication
      - chronic_pulmonary_disease
      - renal_disease
      - congestive_heart_failure
      - inpatient_exposure_90d
      - past_abx
      - prior_positive_esbl
    Infection characteristics:
      - site
      - organism_bug
      - n_sites
      - n_samples
      - culture_span_days
      - days_from_admission_to_first_culture
    Pathology and vitals:
      - temperature
      - crp
    Clinical outcomes:
      - length_of_stay_days
      - in_hosp_mortality

  categorical:                   # n (%) for every level
    - gender
    - ethnicity_desc
    - tfc
    - prophylaxis_group
    - cci_group
    - site
    - organism_bug

  binary:                        # 0/1 flags: n (%) with the flag
    - malignancy
    - metastatic_solid_tumor
    - diabetes_without_complication
    - diabetes_with_complication
    - chronic_pulmonary_disease
    - renal_disease
    - congestive_heart_failure
    - inpatient_exposure_90d
    - past_abx
    - prior_positive_esbl
    - in_hosp_mortality

  # All 17 Charlson flags (comorbidicare names) for the supplementary table.
  supplementary_conditions:
    - myocardial_infarction
    - congestive_heart_failure
    - peripheral_vascular_disease
    - cerebrovascular_disease
    - dementia
    - chronic_pulmonary_disease
    - rheumatic_disease
    - peptic_ulcer_disease
    - mild_liver_disease
    - diabetes_without_complication
    - diabetes_with_complication
    - hemiplegia_or_paraplegia
    - renal_disease
    - malignancy
    - moderate_or_severe_liver_disease
    - metastatic_solid_tumor
    - aids_hiv

