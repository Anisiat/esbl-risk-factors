# esbl_rf pipeline configuration (the "control panel"). Read once by
# esbl_rf.config.load_config; relative paths are resolved against the
# directory containing this file, so the working directory does not matter.

# --- Study definition ---------------------------------------------------
study:
  study_start: "2015-01-01"
  study_end: "2025-09-30"        # inclusive; decided 2026-11-12
  min_age: 18
  elective_admission_methods: [11, 12, 13]
  organisms:
    - escherichia coli
    - klebsiella pneumoniae
    - klebsiella oxytoca
    - proteus mirabilis

sample_eligibility:
  min_hours_after_admission: 48
  max_days_after_surgery: 30     # CHANGE vs manuscript (was: up to 30 days after discharge)
  # Screening (non-diagnostic) samples, as in the manuscript's split_microbiology_screens:
  # a lab culture code in culture_codes, or a rectal site. Compared lower-cased.
  screening:
    culture_codes: [crocul, itucul, rgns, xincul]
    rectal_sites: [rectal swab, rectum, rectal]

# Specimen site grouping (ported from the manuscript's group_specimen_site). Site and culture
# type are lower-cased, '-' and '/' become spaces, then the first group whose pattern matches
# wins; anything unmatched is other_label. Drop pattern: the manuscript's extra
# (?=.*pleural)(?=.*fluid) alternative was redundant with 'fluid' and is not kept.
sites:
  other_label: other
  groups:
    - {label: blood, pattern: '\bblood\b'}
    - {label: urine, pattern: '\burine\b|\burin\b'}
    - {label: sputum, pattern: '\bsputum\b|\bbronchoalveolar\b|\bbronchial\b|\bbal\b'}
    - {label: wound, pattern: '\bwound\b|\bpus\b'}
    - {label: drain, pattern: '\bdrain\b|\bfluid\b|\bbile\b'}
    - {label: tissue/biopsy, pattern: '\btissue\b|\bbiopsy\b'}
    - {label: tips_devices, pattern: '\btips\b|\btip\b|\bdevices\b|\bcatheter\b'}
  # Episode site = the first of these present among the episode's samples.
  hierarchy: [blood, urine, tips_devices, drain, wound, sputum, tissue/biopsy, other]

# Episode table (esbl_rf.episodes.aggregate_episodes): output column -> sample-table column.
episode_table:
  spell_columns:                 # taken once per episode; must not differ within an episode
    subject: subject
    spell_identifier: spell_identifier
    admission_date: admission_ts
    discharge_date: discharge_ts
    age_at_admission: age_at_admission_n
    imd_decile: index_of_multiple_deprivation_decile
  index_sample_columns:          # taken from the episode's first sample (its attributed surgery)
    surgery_start_dt: surgery_start_ts
    surgery_stop_dt: surgery_stop_ts
    procedure_desc: procedure_desc
    surgical_area: surgical_area
    tfc: tfc_group
    n_surgeries: n_surgeries_before
    min_days_from_surgery_to_infection: days_from_surgery_to_sample

# Generic procedure labels (lower-case). Dropped from a spell only if the spell also has a
# real procedure (as in the manuscript's get_surgery_features). Emergency labels such as
# 'emergency ncepod (surg)' are removed in sql/pipeline/02_cohort.sql, so they must not appear.
surgery:
  meta_procedure_labels: [other operative procedure (surg), not in enumerations list]

episodes:
  gap_days: 14                   # new episode if gap since previous positive culture > gap_days

# ESBL labelling (analysis_plan section 6). Drugs and marker strings that the rules
# look for in the result strings of microbiology_results.csv (the strings themselves
# are classed resistant/susceptible by lookups/3GCR.csv and lookups/3GCS.csv).
outcome:
  resistant_drugs: [cefotaxime, ceftazidime, ceftriaxone, cefpodoxime, cefixime]   # any resistant result = ESBL
  susceptible_alone_drugs: [cefpodoxime]       # susceptible on its own = non-ESBL
  susceptible_pairs: [[cefotaxime, ceftazidime], [ceftriaxone, ceftazidime]]   # both susceptible = non-ESBL
  marker_prefix: "esbl markers (ss = present)"
  marker_positive: [sensitive, susceptible, "susceptible with optimised dosing, refer to antimicrobial policy"]
  marker_negative: [resistant]
  esbl_statement_column: esbl_statement        # sample flag in microbiology_ekp.csv: lab reports the ESBL-producer statement

suppression_threshold: 5        # counts below this are shown as <10

# --- Folders and files --------------------------------------------------
# Each folder is defined once; files below are names inside that folder.
paths:
  raw_dir: data/raw              # CSVs exported from the SDE Snowflake worksheets
  lookup_dir: lookups            # tracked: outcome definitions, no patient data
  interim_dir: data/interim      # checkpoints written by each step
  export_dir: outputs/export     # aggregate, suppressed outputs only

# One entry per CSV exported by sql/pipeline/10_exports.sql (grain in docs/sql_tables.md).
raw_csv:
  qa_flowchart_sql: qa_flowchart_sql.csv
  qa_build_log: qa_build_log.csv
  surgery_cohort: surgery_cohort.csv
  spells: spells.csv
  spell_microbiology: spell_microbiology.csv
  microbiology_ekp: microbiology_ekp.csv
  microbiology_results: microbiology_results.csv
  demographics: demographics.csv
  problems: problems.csv
  diagnoses: diagnoses.csv
  prescriptions: prescriptions.csv
  abx_administrations: abx_administrations.csv
  temperature: temperature.csv
  crp: crp.csv
  inpatient_exposure: prior_inpatient_exposure.csv
  emergency_exposure: prior_emergency_exposure.csv
  outpatient_exposure: prior_outpatient_exposure.csv

# Hand-maintained tables that already exist in the SDE (not exported from SQL).
lookup_csv:
  third_gen_ceph_resistant: 3GCR.csv
  third_gen_ceph_susceptible: 3GCS.csv

# treatment_function_code_des (stripped, lower-cased) -> specialty group, as in the
# manuscript's configs/tfc.yaml. Values not listed here are left missing and the
# step logs them with counts, so a spelling difference shows up on the first run.
tfc_groups:
  "hepatobiliary & pancreatic surgery": abdominal_gi
  "colorectal surgery": abdominal_gi
  "upper gastrointestinal surgery": abdominal_gi
  "general surgery": general_surgery
  "urology": uro_nephro
  "nephrology": uro_nephro
  "gynaecology": obs_gynae
  "gynaecological oncology": gynaecological_oncology
  "obstetrics": obs_gynae
  "cardiac surgery": cardiothoracic
  "thoracic surgery": cardiothoracic
  "cardiothoracic surgery": cardiothoracic
  "cardiology": cardiothoracic
  "trauma & orthopaedics": ortho_plastics
  "plastic surgery": ortho_plastics
  "neurosurgery": neuro_ent
  "ent": neuro_ent
  "vascular surgery": vascular

# --- Column names -------------------------------------------------------
# Column names as they appear after esbl_rf.io lower-cases the Snowflake headers.
# Typed timestamp columns (*_ts) come from sql/pipeline/01-04; raw names from
# docs/data_dictionary.xlsx.
columns:
  subject: subject
  spell: spell_identifier
  admission: admission_ts
  discharge: discharge_ts
  collect: collect_ts            # sample collection time (spell_microbiology.csv)
  surgery_start: surgery_start_ts
  surgery_stop: surgery_stop_ts
  surgery_anchor: surgery_anchor_ts   # surgery start (00_params.sql: surgery_anchor)
  organism: organism_bug
  culture_code: culture_code     # lab order code (spell_microbiology.csv)
  site: site
  procedure: procedure_desc      # surgery_cohort.csv
  culture_type: culture_type     # spell_microbiology.csv; used with site to group specimen sites
  site_group: site_grouped       # created by esbl_rf.sites
  tfc_desc: treatment_function_code_des   # truncated in the source (_des, not _desc)
  tfc_group: tfc_group           # created by esbl_rf.surgery.map_specialty
  # Surgery columns copied onto each sample from its most recent preceding surgery
  # (surgery_cohort.csv; names from sql/pipeline/02_cohort.sql).
  surgery_columns: [surgery_event_id, surgery_anchor_ts, surgery_start_ts, surgery_stop_ts,
                  procedure_desc, surgical_area, treatment_function_code_des]
  sample_key: [subject, lab_test_id, organism_bug]
  outcome: esbl_status           # grouping column for Table 1 and outcome of all models
  demographics: [subject, death_date, ethnicity_desc, gender_desc]          # kept on load
  problems: [subject, problem_code, problem_desc, problem_dt_tm]            # kept on load

# --- Table 1 ------------------------------------------------------------
table1:
  columns:
    - esbl_status
    - age_at_admission
    - gender
    - ethnicity_desc
    - imd_decile

    - tfc

    - cci_score
    - cci_group
    # Subset of the 17 Charlson flags for the main table (decided 2026-11-13);
    # the full list is in supplementary_conditions below.
    - malignancy
    - metastatic_solid_tumor
    - diabetes_without_complication
    - diabetes_with_complication
    - chronic_pulmonary_disease
    - renal_disease
    - congestive_heart_failure

    - inpatient_exposure_90d

    - n_surgeries
    - surgery_length
    - min_days_from_surgery_to_infection

    - prophylaxis_group
    - delta_hours_prophylaxis

    - site
    - n_sites
    - organism_bug
    - n_samples
    - culture_span_days
    - prior_positive_esbl

    - temp
    - crp

    - past_abx

    - length_of_stay_days
    - in_hosp_mortality

  categorical:
    - tfc
    - gender
    - ethnicity_desc
    - site
    - organism_bug
    - past_abx
    - prophylaxis_group
    - cci_group
    - malignancy
    - metastatic_solid_tumor
    - diabetes_without_complication
    - diabetes_with_complication
    - chronic_pulmonary_disease
    - renal_disease
    - congestive_heart_failure
    - inpatient_exposure_90d
    - in_hosp_mortality
    - prior_positive_esbl

  nonnormal:                     # shown as median [IQR]
    - cci_score
    - age_at_admission
    - imd_decile
    - length_of_stay_days
    - n_surgeries
    - surgery_length
    - min_days_from_surgery_to_infection
    - temp
    - crp
    # CHANGE vs manuscript (decided 2026-11-13): skewed counts/durations,
    # previously shown as mean (SD).
    - delta_hours_prophylaxis
    - n_sites
    - n_samples
    - culture_span_days

  # All 17 Charlson flags (comorbidicare names) for the supplementary table.
  # Descriptive only: no p-values anywhere in Table 1 or its supplement.
  supplementary_conditions:
    - myocardial_infarction
    - congestive_heart_failure
    - peripheral_vascular_disease
    - cerebrovascular_disease
    - dementia
    - chronic_pulmonary_disease
    - rheumatic_disease
    - peptic_ulcer_disease
    - mild_liver_disease
    - diabetes_without_complication
    - diabetes_with_complication
    - hemiplegia_or_paraplegia
    - renal_disease
    - malignancy
    - moderate_or_severe_liver_disease
    - metastatic_solid_tumor
    - aids_hiv

# --- Charlson Comorbidity Index (comorbidicare) -------------------------
cci:
  cutoff: admission              # evidence strictly before admission
  group_edges: [0, 1, 3]         # cci_group: 0 | 1-2 | >=3 (left-closed bins)
  group_labels: ["0", "1-2", ">=3"]

# --- Logistic regression ------------------------------------------------
logistic_regression:
  cluster_col: subject           # patient-clustered standard errors
  id_columns: [subject, infection_id, admission_date]

  predictors:
    continuous:
      - age_at_admission
      - imd_decile
      - days_from_admission_to_first_culture
      - surgery_length
      - min_days_from_surgery_to_infection
      - temp
      - crp
      - cci_score                # CHANGE vs manuscript: replaces the individual comorbidities

    binary:
      - gender
      - past_abx
      - inpatient_exposure_90d
      - prior_positive_esbl

    categorical:
      - ethnicity_desc
      - organism_bug
      - site
      - tfc
      - prophylaxis_group

  reference_levels:
    site: blood
    organism_bug: escherichia coli
    ethnicity_desc: white
    tfc: general_surgery
    prophylaxis_group: "cefuroxime +/- metronidazole"
