# esbl_rf pipeline configuration (the "control panel"). Read once by
# esbl_rf.config.load_config; relative paths are resolved against the
# directory containing this file, so the working directory does not matter.

# --- Study definition ---------------------------------------------------
study:
  study_start: "2015-01-01"
  study_end: "2025-09-30"        # inclusive; decided 2026-11-12
  min_age: 18
  elective_admission_methods: [11, 12, 13]
  organisms:
    - escherichia coli
    - klebsiella pneumoniae
    - klebsiella oxytoca
    - proteus mirabilis

sample_eligibility:
  min_hours_after_admission: 48
  max_days_after_surgery: 30     # CHANGE vs manuscript (was: up to 30 days after discharge)

episodes:
  gap_days: 14                   # new episode if gap since previous positive culture > gap_days

suppression_threshold: 10        # counts below this are shown as <10

# --- Folders and files --------------------------------------------------
# Each folder is defined once; files below are names inside that folder.
paths:
  raw_dir: data/raw              # CSVs exported from the SDE Snowflake worksheets
  lookup_dir: data/lookups       # small mapping tables
  interim_dir: data/interim      # checkpoints written by each step
  export_dir: outputs/export     # aggregate, suppressed outputs only

raw_csv:
  surgery_microbiology: surgery_patients_microbiology.csv
  all_microbiology: all_microbiology_ekp.csv
  demographics: demographics.csv
  problems: problems.csv
  prescriptions: prescriptions.csv
  abx_administrations: abx_administrations.csv
  crp: crp.csv
  temperature: temperature.csv
  emergency_exposure: prior_emergency_exposure.csv
  inpatient_exposure: prior_inpatient_exposure.csv
  outpatient_exposure: prior_outpatient_exposure.csv

lookup_csv:
  ethnicity: ethnicity_lookup.csv
  tfc_mapping: treatment_function_mapping.csv
  msc_mapping: main_specialty_mapping.csv
  third_gen_ceph_resistant: 3GCR.csv
  third_gen_ceph_susceptible: 3GCS.csv

# --- Column names -------------------------------------------------------
# Raw column names used by the cohort stage (taken from the baseline code;
# to be checked against docs/data_dictionary.xlsx).
columns:
  subject: subject
  admission: admission_date
  collect: latest_collect_dt
  surgery_start: surgery_start_dt
  surgery_stop: surgery_stop_dt
  organism: organism_bug
  sample_key: [subject, lab_test_id, organism_bug]
  outcome: esbl_status           # grouping column for Table 1 and outcome of all models
  demographics: [subject, ethnicity_desc, gender, death_date]   # kept on load
  problems: [subject, problem_desc, problem_dt]                  # kept on load

# --- Table 1 ------------------------------------------------------------
table1:
  columns:
    - esbl_status
    - age_at_admission
    - gender
    - ethnicity_desc
    - imd_decile

    - tfc

    - cci_score
    - cci_group
    # Subset of the 17 Charlson flags for the main table (decided 2026-11-13);
    # the full list is in supplementary_conditions below.
    - malignancy
    - metastatic_solid_tumor
    - diabetes_without_complication
    - diabetes_with_complication
    - chronic_pulmonary_disease
    - renal_disease
    - congestive_heart_failure

    - inpatient_exposure_90d

    - n_surgeries
    - surgery_length
    - min_days_from_surgery_to_infection

    - prophylaxis_group
    - delta_hours_prophylaxis

    - site
    - n_sites
    - organism_bug
    - n_samples
    - culture_span_days
    - prior_positive_esbl

    - temp
    - crp

    - past_abx

    - length_of_stay_days
    - in_hosp_mortality

  categorical:
    - tfc
    - gender
    - ethnicity_desc
    - site
    - organism_bug
    - past_abx
    - prophylaxis_group
    - cci_group
    - malignancy
    - metastatic_solid_tumor
    - diabetes_without_complication
    - diabetes_with_complication
    - chronic_pulmonary_disease
    - renal_disease
    - congestive_heart_failure
    - inpatient_exposure_90d
    - in_hosp_mortality
    - prior_positive_esbl

  nonnormal:                     # shown as median [IQR]
    - cci_score
    - age_at_admission
    - imd_decile
    - length_of_stay_days
    - n_surgeries
    - surgery_length
    - min_days_from_surgery_to_infection
    - temp
    - crp
    # CHANGE vs manuscript (decided 2026-11-13): skewed counts/durations,
    # previously shown as mean (SD).
    - delta_hours_prophylaxis
    - n_sites
    - n_samples
    - culture_span_days

  # All 17 Charlson flags (comorbidicare names) for the supplementary table.
  # Descriptive only: no p-values anywhere in Table 1 or its supplement.
  supplementary_conditions:
    - myocardial_infarction
    - congestive_heart_failure
    - peripheral_vascular_disease
    - cerebrovascular_disease
    - dementia
    - chronic_pulmonary_disease
    - rheumatic_disease
    - peptic_ulcer_disease
    - mild_liver_disease
    - diabetes_without_complication
    - diabetes_with_complication
    - hemiplegia_or_paraplegia
    - renal_disease
    - malignancy
    - moderate_or_severe_liver_disease
    - metastatic_solid_tumor
    - aids_hiv

# --- Charlson Comorbidity Index (comorbidicare) -------------------------
cci:
  cutoff: admission              # evidence strictly before admission
  group_edges: [0, 1, 3]         # cci_group: 0 | 1-2 | >=3 (left-closed bins)
  group_labels: ["0", "1-2", ">=3"]

# --- Logistic regression ------------------------------------------------
logistic_regression:
  cluster_col: subject           # patient-clustered standard errors
  id_columns: [subject, infection_id, admission_date]

  predictors:
    continuous:
      - age_at_admission
      - imd_decile
      - days_from_admission_to_first_culture
      - surgery_length
      - min_days_from_surgery_to_infection
      - temp
      - crp
      - cci_score                # CHANGE vs manuscript: replaces the individual comorbidities

    binary:
      - gender
      - past_abx
      - inpatient_exposure_90d
      - prior_positive_esbl

    categorical:
      - ethnicity_desc
      - organism_bug
      - site
      - tfc
      - prophylaxis_group

  reference_levels:
    site: blood
    organism_bug: escherichia coli
    ethnicity_desc: white
    tfc: general_surgery
    prophylaxis_group: "cefuroxime +/- metronidazole"
